        value_at: Value at
        amount_cents: Amount (Cents)
        amount: Amount
        purpose: Purpose
      bgit/accounting/banking/transfer_voucher:
        <<: *shared
        note: Note
        voucher_id: Voucher
        voucher: Voucher
        transfer_id: Transfer
        transfer: Transfer
  bgit:
    accounting:
      add_association_fields:
        add: "Add {model_name}"
  classes:
    bgit/accounting/engine: Accounting
  routes:
    bgit-accounting-engine: accounting
