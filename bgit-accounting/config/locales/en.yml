        other: Transfers
      bgit/accounting/banking/transfer_voucher:
        one: Transfer Voucher
        other: Transfer Vouchers
      bgit/accounting/vouchers/amount:
        one: Amount
        other: Amounts
      bgit/accounting/vouchers/purchase_invoice:
        one: Purchase Invoice
        other: Purchase Invoices
      bgit/accounting/vouchers/sales_invoice:
        one: Sales Invoice
        other: Sales Invoices
      bgit/accounting/vouchers/unchecked:
        one: Unchecked Voucher
        other: Unchecked Vouchers
      bgit/accounting/vouchers/voucher:
