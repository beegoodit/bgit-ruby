de:
  activerecord:
    models:
      bgit/accounting/accounting/account:
        one: Konto
        other: Konten
      bgit/accounting/banking/account:
        one: Bankkonto
        other: Bankkonten
      bgit/accounting/banking/transfer:
        one: Buchung
        other: Buchungen
      bgit/accounting/banking/transfer_voucher:
        one: Buchungsbeleg
        other: Buchungsbelege
      bgit/accounting/vouchers/amount:
        one: Betrag
        other: Beträge
      bgit/accounting/vouchers/purchase_invoice:
        one: Eingangsrechnung
        other: Eingangsrechnungen
      bgit/accounting/vouchers/sales_invoice:
        one: Ausgangsrechnung
        other: Ausgangsrechnungen
      bgit/accounting/vouchers/unchecked:
        one: Ungeprüfter Beleg
        other: Ungeprüfte Belege
      bgit/accounting/vouchers/voucher:
        one: Beleg
        other: Belege
    attributes:
      shared: &shared
        id: ID
        created_at: Erstellt am
        updated_at: Aktualisiert am
      bgit/accounting/banking/account:
        <<: *shared
        accountable_type: Verantwortliche(r) Typ
        accountable_id: Verantwortliche(r) ID
        accountable: Verantwortliche(r)
        name: Name
        owner: Besitzer
        iban: IBAN
        bic: BIC
        active_from: Aktiv von
        active_to: Aktiv bis
      bgit/accounting/banking/transfer:
        <<: *shared
        recipient_bank_account_id: Empfänger Bankkonto ID
        recipient_bank_account: Empfänger Bankkonto
        sender_bank_account_id: Sender Bankkonto ID
        sender_bank_account: Sender Bankkonto
        transaction_at: Transaktion am
        value_at: Wertstellung am
        amount_cents: Betrag (Cent)
        amount: Betrag
        purpose: Verwendungszweck
      bgit/accounting/banking/transfer_voucher:
        <<: *shared
        note: Notiz
        voucher_id: Beleg
        voucher: Beleg
        transfer_id: Buchung
        transfer: Buchung
  bgit:
    accounting:
      add_association_fields:
        add: "%{model_name} hinzufügen"
  classes:
    bgit/accounting/engine: Accounting
  routes:
    bgit-accounting-engine: accounting
